name: scientific

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  tutorials:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tests/requirements-pinned.txt pytest
      - run: pytest tests/scientific --run-scientific
